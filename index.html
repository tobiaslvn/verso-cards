<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verso Cards</title>
  <meta name="description" content="Verso Cards" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="FAVI.svg" type="image/svg+xml" />
</head>
<body>

  <main class="stage">
    <img class="product" src="flower-motif.jpeg" alt="Verso card with hand-painted flower motif" />
  </main>

  <!-- Agentation: local-only visual feedback toolbar, never loads in production -->
  <script type="module">
    if (["localhost", "127.0.0.1"].includes(location.hostname)) {
      const [React, { createRoot }, { Agentation }] = await Promise.all([
        import("https://esm.sh/react@18"),
        import("https://esm.sh/react-dom@18/client"),
        import("https://esm.sh/agentation@3?deps=react@18,react-dom@18"),
      ]);
      const mount = document.createElement("div");
      document.body.appendChild(mount);
      createRoot(mount).render(
        React.createElement(Agentation, {
          endpoint: "http://localhost:4747",
          appName: "Verso Cards",
        })
      );
    }
  </script>
</body>
</html>
